name: simulora-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: simulora
      POSTGRES_USER: simulora
      POSTGRES_PASSWORD: simulora
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulora -d simulora"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: simulora
      MINIO_ROOT_PASSWORD: change-me-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
