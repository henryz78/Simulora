name: Production implementation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: simulora
          POSTGRES_USER: simulora
          POSTGRES_PASSWORD: simulora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simulora -d simulora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      SIMULORA_ENV: test
      SIMULORA_DATABASE_URL: postgres://simulora:simulora@127.0.0.1:5432/simulora
      SIMULORA_AUTH_ADAPTER: development
      SIMULORA_MODEL_ADAPTER: deterministic
      # IP-9: a real S3-compatible store for export artifacts and outage drills.
      SIMULORA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      SIMULORA_TEST_S3_BUCKET: simulora-ci
      SIMULORA_TEST_S3_ACCESS_KEY: simulora
      SIMULORA_TEST_S3_SECRET_KEY: change-me-local-only

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A service container cannot pass MinIO its `server` arguments, so start it here.
      - name: Start S3-compatible object store
        run: |
          docker run -d --name simulora-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=simulora -e MINIO_ROOT_PASSWORD=change-me-local-only \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker logs simulora-minio; exit 1; fi
            sleep 1
          done
          SIMULORA_OBJECT_ENDPOINT=http://127.0.0.1:9000 SIMULORA_OBJECT_BUCKET=simulora-ci \
            SIMULORA_OBJECT_ACCESS_KEY=simulora SIMULORA_OBJECT_SECRET_KEY=change-me-local-only \
            pnpm objects:bucket

      - name: Run migration against empty and prior PostgreSQL schema
        run: |
          pnpm db:migrate
          pnpm db:migrate
          SIMULORA_MIGRATION_VERIFY=1 pnpm db:verify

      - name: Run authoritative PostgreSQL integration suites
        run: pnpm test:postgres

      - name: Run IP-5 quality and PostgreSQL integration checks
        run: pnpm check

      # IP-9.10: seed a source through the real repository and object store, dump
      # it, restore into an isolated database and refuse to trust the copy until
      # every table, integrity rule, canonical hash and stored object checks out.
      - name: Rehearse backup restore into an isolated database
        run: |
          BASE=postgres://simulora:simulora@127.0.0.1:5432
          PG="docker run --rm --network host -e PGPASSWORD=simulora postgres:17-alpine"
          export SIMULORA_OBJECT_ENDPOINT=http://127.0.0.1:9000 SIMULORA_OBJECT_BUCKET=simulora-ci
          export SIMULORA_OBJECT_ACCESS_KEY=simulora SIMULORA_OBJECT_SECRET_KEY=change-me-local-only
          $PG createdb -h 127.0.0.1 -U simulora simulora_drill_source
          $PG createdb -h 127.0.0.1 -U simulora simulora_drill_restored
          SIMULORA_DATABASE_URL=$BASE/simulora_drill_source pnpm db:migrate > /dev/null
          SIMULORA_DATABASE_URL=$BASE/simulora_drill_source pnpm restore:drill --seed
          $PG sh -c "pg_dump -h 127.0.0.1 -U simulora -Fc simulora_drill_source | pg_restore -h 127.0.0.1 -U simulora -d simulora_drill_restored --no-owner --exit-on-error"
          export SIMULORA_DATABASE_URL=$BASE/simulora_drill_source
          SIMULORA_RESTORE_DATABASE_URL=$BASE/simulora_drill_restored pnpm restore:drill
          # The restored migration ledger is complete, so nothing is applied again.
          if SIMULORA_DATABASE_URL=$BASE/simulora_drill_restored pnpm db:migrate | grep -q '^Applied '; then
            echo "The restored database re-applied a migration"; exit 1
          fi
          # A tampered copy must fail the drill rather than be trusted.
          $PG psql -h 127.0.0.1 -U simulora -d simulora_drill_restored -c \
            "delete from simulora.return_orientation_projections where branch_id = (select branch_id from simulora.return_orientation_projections limit 1)"
          if SIMULORA_RESTORE_DATABASE_URL=$BASE/simulora_drill_restored pnpm restore:drill > tampered.json; then
            echo "A tampered restore passed the drill"; exit 1
          fi
          grep -q '"TABLE_CONTENT_IDENTICAL"' tampered.json

      - name: Build and smoke API and worker containers
        run: |
          docker build -f deploy/containers/api.Dockerfile -t simulora-api:g5 .
          docker build -f deploy/containers/worker.Dockerfile -t simulora-worker:g5 .
          OBJECT_ENV="-e SIMULORA_OBJECT_ENDPOINT=http://127.0.0.1:9000 -e SIMULORA_OBJECT_BUCKET=simulora-ci -e SIMULORA_OBJECT_ACCESS_KEY=simulora -e SIMULORA_OBJECT_SECRET_KEY=change-me-local-only"
          docker run -d --network host --name simulora-api-g5 -e SIMULORA_ENV=test -e SIMULORA_DATABASE_URL="$SIMULORA_DATABASE_URL" $OBJECT_ENV simulora-api:g5
          docker run -d --network host --name simulora-worker-g5 -e SIMULORA_ENV=test -e SIMULORA_WORKER_POLL_MS=200 -e SIMULORA_DATABASE_URL="$SIMULORA_DATABASE_URL" $OBJECT_ENV simulora-worker:g5
          trap 'docker rm -f simulora-api-g5 simulora-worker-g5 >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then break; fi
            if [ "$attempt" = 20 ]; then docker logs simulora-api-g5; exit 1; fi
            sleep 1
          done
          for attempt in $(seq 1 20); do
            if [ "$(docker inspect -f '{{.State.Running}}' simulora-worker-g5)" = true ] && docker logs simulora-worker-g5 2>&1 | grep -q '"message":"action.worker_ready"'; then break; fi
            if [ "$attempt" = 20 ]; then docker logs simulora-worker-g5; exit 1; fi
            sleep 1
          done
          # IP-9.4 PERF-ACK: 200 Actions over HTTP at concurrency 10 against the API
          # container, drained by the worker container, under the documented profile.
          set -o pipefail
          pnpm perf:ack | tee perf-ack.json

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Render the production web build under its security headers
        run: |
          docker build -f deploy/containers/web.Dockerfile -t simulora-web:ci .
          docker run -d --name simulora-web-ci -p 127.0.0.1:8080:8080 simulora-web:ci
          trap 'docker rm -f simulora-web-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then break; fi
            if [ "$attempt" = 20 ]; then docker logs simulora-web-ci; exit 1; fi
            sleep 1
          done
          pnpm web:csp

      - name: Run the browser and device matrix
        run: pnpm test:e2e

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
