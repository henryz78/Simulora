name: Production implementation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: simulora
          POSTGRES_USER: simulora
          POSTGRES_PASSWORD: simulora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simulora -d simulora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      SIMULORA_ENV: test
      SIMULORA_DATABASE_URL: postgres://simulora:simulora@127.0.0.1:5432/simulora
      SIMULORA_AUTH_ADAPTER: development
      SIMULORA_MODEL_ADAPTER: deterministic
      # IP-9: a real S3-compatible API server for export artifacts and outage drills.
      SIMULORA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      SIMULORA_TEST_S3_BUCKET: simulora-ci
      SIMULORA_TEST_S3_ACCESS_KEY: simulora
      SIMULORA_TEST_S3_SECRET_KEY: change-me-local-only

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # S3Mock is the public, reproducible S3-compatible CI service.
      - name: Start S3-compatible object store
        run: |
          docker run -d --name simulora-s3mock -p 127.0.0.1:9000:9090 \
            -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=simulora-ci \
            adobe/s3mock:5.2.2
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/favicon.ico >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker logs simulora-s3mock; exit 1; fi
            sleep 1
          done
          SIMULORA_OBJECT_ENDPOINT=http://127.0.0.1:9000 SIMULORA_OBJECT_BUCKET=simulora-ci \
            SIMULORA_OBJECT_ACCESS_KEY=simulora SIMULORA_OBJECT_SECRET_KEY=change-me-local-only \
            pnpm objects:bucket

      - name: Run migration against empty and prior PostgreSQL schema
        run: |
          pnpm db:migrate
          pnpm db:migrate
          SIMULORA_MIGRATION_VERIFY=1 pnpm db:verify

      - name: Run authoritative PostgreSQL integration suites
        run: pnpm test:postgres

      - name: Run IP-5 quality and PostgreSQL integration checks
        run: pnpm check

      # IP-9.10: seed a source through the real repository and object store, dump
      # it, restore into an isolated database and refuse to trust the copy until
      # every table, integrity rule, canonical hash and stored object checks out.
      - name: Rehearse backup restore into an isolated database
        run: |
          BASE=postgres://simulora:simulora@127.0.0.1:5432
          PG="docker run --rm --network host -e PGPASSWORD=simulora postgres:17-alpine"
          export SIMULORA_OBJECT_ENDPOINT=http://127.0.0.1:9000 SIMULORA_OBJECT_BUCKET=simulora-ci
          export SIMULORA_OBJECT_ACCESS_KEY=simulora SIMULORA_OBJECT_SECRET_KEY=change-me-local-only
          $PG createdb -h 127.0.0.1 -U simulora simulora_drill_source
          $PG createdb -h 127.0.0.1 -U simulora simulora_drill_restored
          SIMULORA_DATABASE_URL=$BASE/simulora_drill_source pnpm db:migrate > /dev/null
          SIMULORA_DATABASE_URL=$BASE/simulora_drill_source pnpm restore:drill --seed
          $PG sh -c "pg_dump -h 127.0.0.1 -U simulora -Fc simulora_drill_source | pg_restore -h 127.0.0.1 -U simulora -d simulora_drill_restored --no-owner --exit-on-error"
          export SIMULORA_DATABASE_URL=$BASE/simulora_drill_source
          SIMULORA_RESTORE_DATABASE_URL=$BASE/simulora_drill_restored pnpm restore:drill
          # The restored migration ledger is complete, so nothing is applied again.
          if SIMULORA_DATABASE_URL=$BASE/simulora_drill_restored pnpm db:migrate | grep -q '^Applied '; then
            echo "The restored database re-applied a migration"; exit 1
          fi
          # A tampered copy must fail the drill rather than be trusted.
          $PG psql -h 127.0.0.1 -U simulora -d simulora_drill_restored -c \
            "delete from simulora.return_orientation_projections where branch_id = (select branch_id from simulora.return_orientation_projections limit 1)"
          if SIMULORA_RESTORE_DATABASE_URL=$BASE/simulora_drill_restored pnpm restore:drill > tampered.json; then
            echo "A tampered restore passed the drill"; exit 1
          fi
          grep -q '"TABLE_CONTENT_IDENTICAL"' tampered.json

      # IP-10.4: the approved release's own code seeds its own schema; its backup
      # must restore faithfully (the rollback path, since migrations are
      # successor-only), and both copies must upgrade to this schema and still
      # pass this code's drill.
      - name: Rehearse upgrade from the approved release and rollback by restore
        env:
          PRIOR_RELEASE: c812d6c6d29be86be3557a00b4866b5d01f0499f
        run: |
          BASE=postgres://simulora:simulora@127.0.0.1:5432
          PG="docker run --rm --network host -e PGPASSWORD=simulora postgres:17-alpine"
          export SIMULORA_OBJECT_ENDPOINT=http://127.0.0.1:9000 SIMULORA_OBJECT_BUCKET=simulora-ci
          export SIMULORA_OBJECT_ACCESS_KEY=simulora SIMULORA_OBJECT_SECRET_KEY=change-me-local-only
          git fetch --no-tags --depth 1 origin "$PRIOR_RELEASE"
          GIT_LFS_SKIP_SMUDGE=1 git worktree add --detach "$RUNNER_TEMP/prior" "$PRIOR_RELEASE"
          (cd "$RUNNER_TEMP/prior" && pnpm install --frozen-lockfile > /dev/null)
          $PG createdb -h 127.0.0.1 -U simulora simulora_upgrade_source
          $PG createdb -h 127.0.0.1 -U simulora simulora_upgrade_backup
          (
            cd "$RUNNER_TEMP/prior"
            export SIMULORA_DATABASE_URL=$BASE/simulora_upgrade_source
            pnpm db:migrate > /dev/null
            pnpm restore:drill --seed
          )
          $PG sh -c "pg_dump -h 127.0.0.1 -U simulora -Fc simulora_upgrade_source | pg_restore -h 127.0.0.1 -U simulora -d simulora_upgrade_backup --no-owner --exit-on-error"
          # Rollback: the pre-upgrade backup is identical under the release's own drill.
          (
            cd "$RUNNER_TEMP/prior"
            SIMULORA_DATABASE_URL=$BASE/simulora_upgrade_source               SIMULORA_RESTORE_DATABASE_URL=$BASE/simulora_upgrade_backup pnpm -s restore:drill > "$RUNNER_TEMP/rollback.json"               || { cat "$RUNNER_TEMP/rollback.json"; exit 1; }
          )
          # Forward: both copies take this schema's successor migrations and agree.
          for db in simulora_upgrade_source simulora_upgrade_backup; do
            SIMULORA_DATABASE_URL=$BASE/$db pnpm db:migrate
            SIMULORA_DATABASE_URL=$BASE/$db SIMULORA_MIGRATION_VERIFY=1 pnpm db:verify
          done
          # Each copy applied the successor migrations at its own moment, so only
          # those ledger timestamps may differ; names and checksums must match.
          SIMULORA_DATABASE_URL=$BASE/simulora_upgrade_source             SIMULORA_RESTORE_DATABASE_URL=$BASE/simulora_upgrade_backup pnpm exec tsx scripts/restore-drill.ts > upgraded.json || true
          if ! jq -e '[.checks[] | select(.passed | not) | .detail] == ["differs: app_meta.schema_migrations"]' upgraded.json; then
            cat upgraded.json; exit 1
          fi
          for db in simulora_upgrade_source simulora_upgrade_backup; do
            $PG psql -At -h 127.0.0.1 -U simulora -d $db               -c "select name, checksum from app_meta.schema_migrations order by name" > "ledger-$db.txt"
          done
          diff ledger-simulora_upgrade_source.txt ledger-simulora_upgrade_backup.txt
          # This code can keep writing to the upgraded database.
          SIMULORA_DATABASE_URL=$BASE/simulora_upgrade_source pnpm restore:drill --seed > /dev/null
          git worktree remove --force "$RUNNER_TEMP/prior"

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Build and smoke API and worker containers
        run: |
          docker build -f deploy/containers/api.Dockerfile -t simulora-api:g5 .
          docker build -f deploy/containers/worker.Dockerfile -t simulora-worker:g5 .
          # The runtime gets its own migrated database, so the profile measures this
          # API and worker rather than the backlog the integration suites leave behind.
          docker run --rm --network host -e PGPASSWORD=simulora postgres:17-alpine \
            createdb -h 127.0.0.1 -U simulora simulora_runtime
          export SIMULORA_DATABASE_URL=postgres://simulora:simulora@127.0.0.1:5432/simulora_runtime
          pnpm db:migrate > /dev/null
          OBJECT_ENV="-e SIMULORA_OBJECT_ENDPOINT=http://127.0.0.1:9000 -e SIMULORA_OBJECT_BUCKET=simulora-ci -e SIMULORA_OBJECT_ACCESS_KEY=simulora -e SIMULORA_OBJECT_SECRET_KEY=change-me-local-only"
          docker run -d --network host --name simulora-api-g5 -e SIMULORA_ENV=test -e SIMULORA_DATABASE_URL="$SIMULORA_DATABASE_URL" $OBJECT_ENV simulora-api:g5
          docker run -d --network host --name simulora-worker-g5 -e SIMULORA_ENV=test -e SIMULORA_WORKER_POLL_MS=200 -e SIMULORA_DATABASE_URL="$SIMULORA_DATABASE_URL" $OBJECT_ENV simulora-worker:g5
          trap 'docker rm -f simulora-api-g5 simulora-worker-g5 >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then break; fi
            if [ "$attempt" = 20 ]; then docker logs simulora-api-g5; exit 1; fi
            sleep 1
          done
          for attempt in $(seq 1 20); do
            if [ "$(docker inspect -f '{{.State.Running}}' simulora-worker-g5)" = true ] && docker logs simulora-worker-g5 2>&1 | grep -q '"message":"action.worker_ready"'; then break; fi
            if [ "$attempt" = 20 ]; then docker logs simulora-worker-g5; exit 1; fi
            sleep 1
          done
          # IP-9.4 PERF-ACK: 200 Actions over HTTP at concurrency 10 against the API
          # container, drained by the worker container, under the documented profile.
          set -o pipefail
          if ! pnpm perf:ack | tee perf-ack.json; then
            docker logs simulora-worker-g5 2>&1 | tail -40
            exit 1
          fi
          # A summary of what the worker actually did, as evidence and for diagnosis.
          docker logs simulora-worker-g5 2>&1 | grep -o '"message":"[a-z_.]*"' | sort | uniq -c
          # IP-10.2: the start and cross-capability journeys in a browser through this
          # API, worker, PostgreSQL and object store, not a transport fixture.
          pnpm exec playwright test -c playwright.stack.config.ts
          # IP-10.6 capacity and killed-worker drill: 300 Actions at concurrency 20,
          # well above the LONG-01 fixture. The worker container is SIGKILLed
          # mid-drain and replaced; every acknowledged Action must still reach
          # one proposal, with none generated twice and none left in flight.
          trap 'docker rm -f simulora-api-g5 simulora-worker-g5 simulora-worker-g5b >/dev/null 2>&1 || true' EXIT
          processed() { docker logs simulora-worker-g5 2>&1 | grep -c '"message":"action.processed"' || true; }
          BEFORE=$(processed)
          SIMULORA_PROFILE_ACTIONS=300 SIMULORA_PROFILE_CONCURRENCY=20 pnpm -s perf:ack > drill.json &
          PROFILE=$!
          for attempt in $(seq 1 600); do
            if [ "$(processed)" -gt $((BEFORE + 20)) ]; then break; fi
            if [ "$attempt" = 600 ]; then echo "the worker never started draining"; exit 1; fi
            sleep 0.2
          done
          docker kill --signal KILL simulora-worker-g5
          docker run -d --network host --name simulora-worker-g5b -e SIMULORA_ENV=test -e SIMULORA_WORKER_POLL_MS=200 -e SIMULORA_DATABASE_URL="$SIMULORA_DATABASE_URL" $OBJECT_ENV simulora-worker:g5
          if ! wait $PROFILE; then cat drill.json; docker logs simulora-worker-g5b 2>&1 | tail -40; exit 1; fi
          cat drill.json
          PSQL="docker run --rm --network host -e PGPASSWORD=simulora postgres:17-alpine psql -At -h 127.0.0.1 -U simulora -d simulora_runtime -c"
          test "$($PSQL "select count(*) from simulora.actions where status in ('ACKNOWLEDGED','GENERATING')")" = 0
          test "$($PSQL "select count(*) from (select action_id from simulora.generation_attempts where status = 'SUCCEEDED' group by action_id having count(*) > 1) twice")" = 0
          echo "attempts closed by lease expiry after the kill: $($PSQL "select count(*) from simulora.generation_attempts where error_class = 'LEASE_EXPIRED'")"

      - name: Render the production web build under its security headers
        run: |
          docker build -f deploy/containers/web.Dockerfile -t simulora-web:ci .
          docker run -d --name simulora-web-ci -p 127.0.0.1:8080:8080 simulora-web:ci
          trap 'docker rm -f simulora-web-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then break; fi
            if [ "$attempt" = 20 ]; then docker logs simulora-web-ci; exit 1; fi
            sleep 1
          done
          pnpm web:csp

      - name: Run the browser and device matrix
        run: pnpm test:e2e

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
