name: Production implementation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: simulora
          POSTGRES_USER: simulora
          POSTGRES_PASSWORD: simulora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simulora -d simulora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      SIMULORA_ENV: test
      SIMULORA_DATABASE_URL: postgres://simulora:simulora@127.0.0.1:5432/simulora
      SIMULORA_AUTH_ADAPTER: development
      SIMULORA_MODEL_ADAPTER: deterministic

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migration against empty and prior PostgreSQL schema
        run: |
          pnpm db:migrate
          pnpm db:migrate
          SIMULORA_MIGRATION_VERIFY=1 pnpm db:verify

      - name: Run authoritative PostgreSQL integration suites
        run: pnpm test:postgres

      - name: Run IP-5 quality and PostgreSQL integration checks
        run: pnpm check

      - name: Build and smoke API and worker containers
        run: |
          docker build -f deploy/containers/api.Dockerfile -t simulora-api:g5 .
          docker build -f deploy/containers/worker.Dockerfile -t simulora-worker:g5 .
          docker run -d --network host --name simulora-api-g5 -e SIMULORA_ENV=test -e SIMULORA_DATABASE_URL="$SIMULORA_DATABASE_URL" simulora-api:g5
          docker run -d --network host --name simulora-worker-g5 -e SIMULORA_ENV=test -e SIMULORA_DATABASE_URL="$SIMULORA_DATABASE_URL" simulora-worker:g5
          trap 'docker rm -f simulora-api-g5 simulora-worker-g5 >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then break; fi
            if [ "$attempt" = 20 ]; then docker logs simulora-api-g5; exit 1; fi
            sleep 1
          done
          for attempt in $(seq 1 20); do
            if [ "$(docker inspect -f '{{.State.Running}}' simulora-worker-g5)" = true ] && docker logs simulora-worker-g5 2>&1 | grep -q '"message":"action.worker_ready"'; then break; fi
            if [ "$attempt" = 20 ]; then docker logs simulora-worker-g5; exit 1; fi
            sleep 1
          done

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run desktop and 390x844 browser checks
        run: pnpm test:e2e

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
