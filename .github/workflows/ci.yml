name: Production foundation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: simulora
          POSTGRES_USER: simulora
          POSTGRES_PASSWORD: simulora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simulora -d simulora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      SIMULORA_ENV: test
      SIMULORA_DATABASE_URL: postgres://simulora:simulora@127.0.0.1:5432/simulora
      SIMULORA_AUTH_ADAPTER: development
      SIMULORA_MODEL_ADAPTER: deterministic

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migration against empty and prior PostgreSQL schema
        run: |
          pnpm db:migrate
          pnpm db:migrate

      - name: Run foundation checks
        run: pnpm check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run desktop and 390x844 browser checks
        run: pnpm test:e2e

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
